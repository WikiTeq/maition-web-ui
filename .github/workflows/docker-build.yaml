name: Create and publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

env:
  IMAGE_NAME: maition-web-ui
  NODE_OPTIONS: --max-old-space-size=4096

# allow multiple concurrent runs for this workflow for different branches
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine commit SHA
        id: sha
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wikiteq/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.sha.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
          labels: |
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          build-args: |
            BUILD_HASH=${{ steps.sha.outputs.sha }}

  notify:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.build.outputs.digest != ''
    permissions:
      pull-requests: write
    steps:
      - name: Format tags
        id: format
        run: |
          TAGS="${{ needs.build.outputs.tags }}"
          TAGS=$(echo "$TAGS" | sed -E 's/.*/`&`/' | paste -sd, - | sed 's/,/, /g')
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Notify about image tag
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: comment
          message: >-
            :whale: The image has been built and pushed with the following tags:
            ${{ steps.format.outputs.tags }}
          recreate: true
          fail: false
